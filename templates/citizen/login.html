{% extends "citizen/base.html" %}
{% block title %}Sign in · Emergency Help{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" class="panel">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <div class="fields">{{ form.as_div }}</div>
  <button class="btn btn-primary btn-block" type="submit">Sign in</button>
</form>
<p class="center">New here? <a href="{% url 'citizens:register' %}">Create an account</a></p>
{% endblock %}
